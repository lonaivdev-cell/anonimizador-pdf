name: Release

# Publishes a GitHub Release with the debug APK attached.
# Trigger either by pushing a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`)
# or manually via the Actions tab ("Run workflow") providing a version like v1.0.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Derive the Android versionName/versionCode from the tag so the APK's
          # internal version always matches the release tag (no manual drift).
          VERSION_NAME="${TAG#[vV]}"
          CORE="$(echo "$VERSION_NAME" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo '0.0.0')"
          IFS='.' read -r MAJ MIN PAT <<< "$CORE"
          VERSION_CODE=$((10#$MAJ * 10000 + 10#$MIN * 100 + 10#$PAT))
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Stage APK
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/debug/app-debug.apk \
            "release-out/anonimizador-pdf-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: release-out/*.apk
